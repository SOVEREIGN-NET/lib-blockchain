[package]
name = "zhtp-blockchain"
version = "0.1.0"
edition = "2021"
description = "ZHTP Blockchain Core Implementation"
license = "MIT"

[dependencies]
# External dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
log = "0.4"
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
hex = "0.4"
blake3 = "1.5"
rand = "0.8"

# Internal ZHTP dependencies
zhtp-crypto = { path = "../zhtp-crypto" }
zhtp-zk = { path = "../zhtp-zk" }
zhtp-identity = { path = "../zhtp-identity" }
# zhtp-economics = { path = "../zhtp-economics" }  # TODO: Add when package is created

[features]
default = []
testing = []
