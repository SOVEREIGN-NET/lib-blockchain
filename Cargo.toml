[package]
name = "lib-blockchain"
version = "0.1.0"
edition = "2021"
description = "ZHTP Blockchain Core Implementation"
license = "MIT"

[dependencies]
# External dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
log = "0.4"
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
hex = "0.4"
blake3 = "1.5"
rand = "0.8"

# Internal ZHTP dependencies
lib-crypto = { path = "../lib-crypto" }
lib-proofs = { path = "../lib-proofs" }
lib-identity = { path = "../lib-identity" }
# lib-economy = { path = "../lib-economy" }  # TODO: Add when package is created

[features]
default = []
testing = []
